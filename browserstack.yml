# Cross-browser run on BrowserStack. See .github/workflows/browserstack.yml.
# Credentials come from BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY.
# Never add them to this file.
projectName: meridian-consent
buildName: meridian-consent

platforms:
    - os: Windows
      osVersion: '11'
      browserName: edge
      browserVersion: latest
    - os: Windows
      osVersion: '11'
      browserName: playwright-firefox
      browserVersion: latest
    - os: OS X
      osVersion: Sequoia
      browserName: playwright-webkit
      browserVersion: latest

parallelsPerPlatform: 1

# The app runs inside the CI runner, so remote browsers reach it by tunnel.
browserstackLocal: true

debug: true
testObservability: true
