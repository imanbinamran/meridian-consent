          title: 'A Malay browser sees English until the visitor chooses BM',
          priority: P1,
          requirement_refs: [REQ-1],
          tags: [e2e],
      }
    - {
          id: LNG-022,
          title: 'Each public page reads in BM and stays BM after a reload',
          priority: P1,
