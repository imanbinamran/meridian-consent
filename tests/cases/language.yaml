          requirement_refs: [REQ-6],
          tags: [pest],
      }
    - {
          id: LNG-013,
          title: 'The English and Malay word files have the same shape',
          priority: P2,
          requirement_refs: [REQ-8],
          tags: [pest],
      }
    - {
          id: LNG-014,
          title: 'Every word key the pages ask for exists',
