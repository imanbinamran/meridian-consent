          - Accept with the Pusher call pointed at a closed port
      assertions:
          - {
                id: A1,
                kind: state,
                description: Short timeouts,
                expected: 'The client request timeout is 2 seconds and the connect timeout 1, under the 5 second job timeout',
                provenance: REQ-30,
            }
          - {
                id: A2,
                kind: state,
                description: Boots without settings,
                expected: 'artisan exits cleanly and live updates report off',
                provenance: REQ-30,
            }
          - {
                id: A3,
                kind: state,
                description: Pusher unreachable,
                expected: 'The accept redirects and the row is saved',
                provenance: REQ-30,
            }
      cleanup: 'Rolled back by RefreshDatabase'
      tags: [pest]
      notes: 'LiveOverviewTest.php. A3 runs on the sync queue, the worst case, as ADM-058 does for Reverb.'

